name: Microservice Workflow Bash
on:
  pull_request:
    types:
      - closed
    branches: [main]

jobs:
  update_microservice:
    runs-on: ubuntu-latest
    environment: Environment_LeanIX_Edison_Sandbox
    env:
      LEANIX_API_TOKEN: ${{ secrets.LEANIX_API_TOKEN }}
      LEANIX_SUBDOMAIN: ${{ vars.LEANIX_SUBDOMAIN }}
      REPOSITORY_URL: ${{ github.repositoryUrl }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Register microservice in LeanIX
        run: bash ./leanix_register.sh